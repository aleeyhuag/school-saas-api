# Sized for Render's 512 MB Starter instance: each PHP worker can use ~40 MB, so
# a small fixed pool avoids running out of memory (the default allows 150).
<IfModule mpm_prefork_module>
    StartServers            3
    MinSpareServers         2
    MaxSpareServers         4
    MaxRequestWorkers       8
    MaxConnectionsPerChild  500
</IfModule>

KeepAlive On
KeepAliveTimeout 5

# Compress API responses (JSON) — big lists shrink a lot on slow data connections.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json application/javascript text/css text/html text/plain text/xml
</IfModule>
