; Keep compiled PHP in memory instead of re-reading and compiling every Laravel
; file on every request. validate_timestamps=0 is safe because a deploy builds a
; brand-new container (files never change underneath a running one).
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
realpath_cache_size=4096K
realpath_cache_ttl=600
