# Database is hosted on Supabase, NOT Render's managed Postgres -- do
# not add a `databases:` block here for it. Get your connection details
# from Supabase -> Project Settings -> Database -> Connection parameters.
# Use the "Session pooler" or "Transaction pooler" host (not the direct
# connection) if you're on a Supabase plan where the direct connection
# isn't reachable from outside their network -- check your project's
# connection page for which applies to you.
#
# HOTFIX NOTE: the cron service below previously used
# `envVars: [{fromGroup: school-saas-api}]`, which is invalid -- Render
# Environment Groups are separate named resources you create yourself,
# not a way to reference another service's env vars by that service's
# name. That meant the cron container almost certainly had NO database
# credentials at all, so every 5-minute tick of `schedule:run` failed
# silently before it could ever run `billing:process-lifecycle` or
# drain the export queue. Fixed below by listing the same values
# explicitly on both services -- deliberately not using a YAML anchor
# here, since it's not worth the risk of Render's Blueprint parser
# handling that differently than expected. If you'd rather maintain one
# copy instead of two, create a real Render "Environment Group" in the
# dashboard, add both services to it, and replace both envVars lists
# below with a single `- fromGroup: <your-group-name>` entry.

services:
  - type: web
    name: school-saas-api
    runtime: docker
    plan: starter # ~$7/month -- free web-service tier's ephemeral disk would wipe every uploaded logo/payment-proof file on each restart/deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    disk:
      name: school-saas-uploads
      # Was mounted at .../storage/app/public only -- student photos
      # live on the PRIVATE disk (storage/app/private), which that
      # path doesn't cover at all. Every redeploy resets the
      # container's ephemeral filesystem, so anything under
      # storage/app/private was being wiped out on every single
      # deploy -- including this one. Mounting one level higher, at
      # storage/app itself, covers both public/ and private/ under
      # the same persistent volume. storage/framework and
      # storage/logs deliberately stay off this disk -- cache/session/
      # log files don't need to survive a deploy, and regenerating
      # them fresh is normal.
      mountPath: /var/www/html/storage/app
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Skulag
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false # set to your actual Render URL (or custom domain) after first deploy
      - key: APP_KEY
        sync: false # generate locally with `php artisan key:generate --show` and paste it here -- keep it FIXED, don't let the container regenerate it on every boot
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false # Supabase project -> Settings -> Database -> connection pooler host
      - key: DB_PORT
        sync: false # 5432 for direct/session pooler, 6543 for Supabase's transaction pooler
      - key: DB_DATABASE
        value: postgres # Supabase's default database name, unless you renamed it
      - key: DB_USERNAME
        sync: false # Supabase connection username, e.g. postgres.xxxxxxxxxxxx for the pooler
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require # Supabase enforces SSL on external connections
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database # only matters if EXPORT_SYNC_MODE is set to false -- see below
      - key: EXPORT_SYNC_MODE
        value: "true" # hotfix default -- exports run inline within the request instead of depending on a queue worker. Flip to "false" only once you've verified the cron service below is actually running (see the hotfix README's verification steps), and understand that reintroduces request-timeout risk for very large exports until a real always-on worker is in place.
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: FRONTEND_URL
        sync: false # your Netlify URL, used for CORS / password-reset links

  # Runs Laravel's scheduler every 5 minutes -- this drives
  # `billing:process-lifecycle` (trial expiry / grace periods, Stage 39)
  # regardless of export mode, and ALSO drains the export queue via
  # `queue:work --stop-when-empty` if you ever set EXPORT_SYNC_MODE back
  # to false. Render bills Cron Jobs only for actual run time, not idle
  # time. Uses the same Docker image as the web service -- no separate
  # build to maintain. Needs its own copy of the DB/mail env vars below
  # (see the hotfix note at the top of this file for why).
  - type: cron
    name: school-saas-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    dockerCommand: php artisan schedule:run
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false # MUST be the exact same value as the web service's APP_KEY
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        value: postgres
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: FRONTEND_URL
        sync: false
