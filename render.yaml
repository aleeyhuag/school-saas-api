# Database is hosted on Supabase, NOT Render's managed Postgres — do
# not add a `databases:` block here for it. Get your connection details
# from Supabase → Project Settings → Database → Connection parameters.
# Use the "Session pooler" or "Transaction pooler" host (not the direct
# connection) if you're on a Supabase plan where the direct connection
# isn't reachable from outside their network — check your project's
# connection page for which applies to you.

services:
  - type: web
    name: school-saas-api
    runtime: docker
    plan: starter # ~$7/month — free web-service tier's ephemeral disk would wipe every uploaded logo/payment-proof file on each restart/deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    disk:
      name: school-saas-uploads
      mountPath: /var/www/html/storage/app/public
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Skulag
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false # set to your actual Render URL (or custom domain) after first deploy
      - key: APP_KEY
        sync: false # generate locally with `php artisan key:generate --show` and paste it here — keep it FIXED, don't let the container regenerate it on every boot
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        sync: false # Supabase project -> Settings -> Database -> connection pooler host
      - key: DB_PORT
        sync: false # 5432 for direct/session pooler, 6543 for Supabase's transaction pooler
      - key: DB_DATABASE
        value: postgres # Supabase's default database name, unless you renamed it
      - key: DB_USERNAME
        sync: false # Supabase connection username, e.g. postgres.xxxxxxxxxxxx for the pooler
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        value: require # Supabase enforces SSL on external connections
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database # backs Stage 54's queued exports -- see the cron job below for the worker
      - key: MAIL_MAILER
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: FRONTEND_URL
        sync: false # your Netlify URL, used for CORS / password-reset links

  # Runs Laravel's scheduler every 5 minutes. This single cron tick
  # drives everything registered in routes/console.php -- the daily
  # billing-lifecycle check AND (from Stage 54) draining any queued
  # exports via `queue:work --stop-when-empty`. Render bills Cron Jobs
  # only for actual run time, not idle time, so this is far cheaper
  # than an always-on worker service while pilot-scale export volume
  # stays low. Uses the same Docker image as the web service so it has
  # identical PHP/extensions/vendor -- no separate build to maintain.
  - type: cron
    name: school-saas-scheduler
    runtime: docker
    dockerfilePath: ./Dockerfile
    schedule: "*/5 * * * *"
    dockerCommand: php artisan schedule:run
    envVars:
      - fromGroup: school-saas-api # reuses the web service's env vars -- set this up as an Environment Group in Render's dashboard once, or duplicate the envVars list above manually if you'd rather not use groups
